# Distributed Payment Processing System
# Application Properties

# Application Configuration
spring.application.name=distributed-payment-system
server.port=8080

# Timezone Configuration - Sri Lanka (UTC+5:30)
spring.jackson.time-zone=Asia/Colombo
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Node Configuration (for distributed setup)
app.node.id=node1
app.node.host=localhost
app.peers=http://localhost:8082,http://localhost:8083

# ZooKeeper / Curator Configuration


zookeeper.connect-string=localhost:2181
zookeeper.session-timeout-ms=30000
zookeeper.connection-timeout-ms=15000
zookeeper.retry.max-retries=3
zookeeper.retry.base-sleep-time-ms=1000
zookeeper.namespace=payment-system

# Consensus Configuration
consensus.quorum-size=2
consensus.timeout-ms=5000
consensus.leader-election-path=/election

# Stripe Payment Gateway Configuration

# IMPORTANT: Replace 'sk_test_your_key_here' with your actual Stripe test secret key
# Get it from: https://dashboard.stripe.com/test/apikeys
# Example: sk_test_51ABC123...
stripe.api.key=sk_test_51TF6BpCbeSPRw4MugCejN1s6pPHXkjUlaKcSBgOQ6l0RQMWIDIVY46F0JcuXzpgzov5jM2LY7N6TkTwue2oebVdL00hP7v7neN
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# Resilience4j Circuit Breaker Configuration

# Circuit Breaker for Payment Service
resilience4j.circuitbreaker.instances.paymentService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.paymentService.automatic-transition-from-open-to-half-open-enabled=true

# Retry Configuration
resilience4j.retry.instances.paymentService.max-attempts=3
resilience4j.retry.instances.paymentService.wait-duration=500ms
resilience4j.retry.instances.paymentService.retry-exceptions=java.io.IOException,java.util.concurrent.TimeoutException

# Timeout Configuration
resilience4j.timelimiter.instances.paymentService.timeout-duration=3s
resilience4j.timelimiter.instances.paymentService.cancel-running-future=true

# Rate Limiter
resilience4j.ratelimiter.instances.paymentService.limit-for-period=100
resilience4j.ratelimiter.instances.paymentService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.paymentService.timeout-duration=0s

# Spring Actuator Configuration

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,retries
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# Custom Health Indicators
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Info Endpoint
info.app.name=${spring.application.name}
info.app.version=1.0.0
info.app.description=Distributed Payment Processing System

# Replication & Failover Configuration

replication.enabled=true
replication.sync-interval-ms=5000
replication.max-retries=3
replication.timeout-ms=3000

failover.enabled=true
failover.heartbeat-interval-ms=2000
failover.health-check-timeout-ms=5000

# Logging Configuration

logging.level.root=INFO
logging.level.com.payment=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.apache.curator=INFO
logging.level.io.github.resilience4j=DEBUG

# Log Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{nodeId}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{nodeId}] %-5level %logger{36} - %msg%n

# Log File Configuration (uncomment for file logging)
# logging.file.name=logs/payment-system.log
# logging.file.max-size=10MB
# logging.file.max-history=30

# Server Configuration

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Timeouts
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=30000

# Thread Pool
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Jackson JSON Configuration

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
