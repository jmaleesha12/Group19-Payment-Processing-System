# Time Sync Module Configuration
server.port=8061

# Application name
spring.application.name=time-sync

# Node configuration
time-sync.node-id=node1

# NTP configuration
time-sync.ntp-server=pool.ntp.org
time-sync.ntp-port=123
time-sync.ntp-timeout=5000

# Sync interval in milliseconds (default: 60 seconds)
time-sync.sync-interval-ms=60000

# Logging
logging.level.com.payment=DEBUG
