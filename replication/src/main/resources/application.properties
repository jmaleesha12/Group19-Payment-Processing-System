# Replication Module Configuration
server.port=8091

# Application name
spring.application.name=replication

# Node configuration
replication.node-id=node1

# Quorum configuration (N=3, W=2, R=2)
replication.total-nodes=3
replication.write-quorum=2
replication.read-quorum=2

# Replica nodes
replication.replicas=http://localhost:8092,http://localhost:8093

# Replication timeout in milliseconds
replication.replication-timeout=5000

# Logging
logging.level.com.payment=DEBUG
