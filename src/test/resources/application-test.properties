# Test Configuration


spring.application.name=distributed-payment-system-test

# Node Configuration (Test)
app.node.id=test-node
app.node.host=localhost
app.peers=


# ZooKeeper - Disabled for Unit Tests

zookeeper.enabled=false
zookeeper.connect-string=localhost:2181

# Consensus - Disabled for Unit Tests
consensus.enabled=false
consensus.quorum-size=1


# Stripe - Test Mode

stripe.api.key=sk_test_mock
stripe.api.secret=sk_test_mock
stripe.webhook.secret=whsec_test_mock

# Resilience4j - Relaxed for Tests

resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=1s

resilience4j.retry.instances.paymentService.max-attempts=2
resilience4j.retry.instances.paymentService.wait-duration=100ms

resilience4j.timelimiter.instances.paymentService.timeout-duration=5s

# Replication & Failover - Disabled for Tests

replication.enabled=false
failover.enabled=false

# Actuator - Minimal for Tests


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging

logging.level.root=WARN
logging.level.com.payment=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
