# Consensus Module Configuration
server.port=8071

# Application name
spring.application.name=consensus

# Node configuration
consensus.node-id=node1

# Peer nodes
consensus.peers=http://localhost:8072,http://localhost:8073

# Election timeout (randomized between min and max)
consensus.election-timeout-min=1500
consensus.election-timeout-max=3000

# Heartbeat interval (leader sends AppendEntries)
consensus.heartbeat-interval=500

# RPC timeout
consensus.rpc-timeout=1000

# Logging
logging.level.com.payment=DEBUG
